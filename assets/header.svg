<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 1000 270" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7F00FF"/>
      <stop offset="0.5" stop-color="#E100FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a2e17"/>
