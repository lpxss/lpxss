name: baixar gifs
on:
  push:
    branches: [gif-candidates]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf cand; mkdir -p cand
          for id in UtEXXnbD8nZoRtZQPd yJvWvOEa5nsTAy7jc6 Ht2LoU26Jm8jZG3OJw EashjVLCRc0UreNBJG hYUp2kPV6T1FOXHWoO JoOV18hVfHQo4tvgCU jtR9VxoH2dwApdLt6X 0QRrqwLTKZJhnPIC8I LWGDfIVBYvVylB5p27 1TN0ueSrpaTq3pzO2C; do
            curl -sL -o cand/$id.gif "https://media.giphy.com/media/$id/giphy.gif" || true
          done
          ls -la cand
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add cand; git commit -m "candidatos"; git push
